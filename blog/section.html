<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#14140f" media="(prefers-color-scheme: dark)">
  <!-- Replaced per-section from the manifest once it loads (see app.js). -->
  <meta name="description" content="Posts from the wecreatethis.com blog.">
  <title>Blog</title>
  <link rel="manifest" href="/blog/manifest.json">
  <link rel="stylesheet" href="/blog/style.css">
  <script src="/sw-toast.js" defer></script>
</head>
<body>
  <header>
    <nav id="crumbs" aria-label="Breadcrumb"></nav>
  </header>

  <main>
    <div class="section-head">
      <h1 id="section-title"></h1>
      <button id="sort-toggle" type="button"></button>
    </div>

    <ul id="subsections"></ul>

    <div id="loading">Loading...</div>
    <div id="post-stack" style="display:none"></div>
  </main>

  <script src="/blog/app.js" defer></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/blog/sw.js', { scope: '/blog/' });
    }
  </script>
</body>
</html>
