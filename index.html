<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#14140f" media="(prefers-color-scheme: dark)">
  <meta name="description" content="Blog.">
  <title>wecreatethis.com</title>
  <meta property="og:title" content="wecreatethis.com">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://wecreatethis.com/">
  <meta property="og:description" content="Blog.">
  <meta property="og:image" content="https://wecreatethis.com/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="wecreatethis.com">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="wecreatethis.com">
  <meta name="twitter:description" content="Blog.">
  <meta name="twitter:image" content="https://wecreatethis.com/og-image.png">
  <link rel="canonical" href="https://wecreatethis.com/">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="manifest.json">
  <link rel="preload" href="/fonts/roboto-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/style.css">
  <script src="/icons.js" defer></script>
  <script src="/sw-toast.js" defer></script>
</head>
<body>
  <header>
    <!-- Static skeleton matches the .top-nav 3-slot shape app.js renders
         (see renderHomeHeader) so the header has its final height on first
         paint - otherwise the empty <nav> starts at 0 height and jumps to
         88px once JS fills it in, shifting all page content down. -->
    <nav id="crumbs" class="top-nav" aria-label="Navigation">
      <span class="nav-slot nav-left" aria-hidden="true"></span>
      <span class="nav-slot nav-center"></span>
      <span class="nav-slot nav-right"></span>
    </nav>
  </header>

  <main>
    <div id="loading">Loading...</div>
    <div id="home-content" class="md-content" style="display:none"></div>
    <div id="featured-tiles" class="md-content" hidden></div>
    <div id="posts-heading-row" class="homepage-section-heading" hidden>
      <h2>All Posts</h2>
    </div>
    <div id="post-list" class="post-toc" hidden></div>
  </main>

  <script src="/app.js" defer></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js', { scope: '/' });
    }
  </script>
</body>
</html>
