<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#14140f" media="(prefers-color-scheme: dark)">
  <!-- Replaced per-section from the manifest once it loads (see app.js). -->
  <meta name="description" content="Posts from the wecreatethis.com blog.">
  <title>wecreatethis.com</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="/style.css">
  <script src="/icons.js" defer></script>
  <script src="/sw-toast.js" defer></script>
</head>
<body>
  <header>
    <nav id="crumbs" aria-label="Navigation"></nav>
  </header>

  <main>
    <div class="section-head">
      <h1 id="section-title"></h1>
    </div>

    <ul id="subsections"></ul>

    <div id="loading">Loading...</div>
    <div id="post-stack" style="display:none"></div>
  </main>

  <nav id="bottom-nav" class="bottom-nav" hidden></nav>

  <script src="/app.js" defer></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js', { scope: '/' });
    }
  </script>
</body>
</html>
