<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#14140f" media="(prefers-color-scheme: dark)">
  <!-- Replaced per-section from the manifest once it loads (see app.js). Social
       preview scrapers don't run JS, so they only ever see this static
       fallback - real per-post/section OG previews need build.js to emit
       static HTML (tracked as a known gap alongside the SEO note in
       CLAUDE-blog.md), not done here. -->
  <meta name="description" content="Blog.">
  <title>wecreatethis.com</title>
  <meta property="og:title" content="wecreatethis.com">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://wecreatethis.com/">
  <meta property="og:description" content="Blog.">
  <meta property="og:image" content="https://wecreatethis.com/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="wecreatethis.com">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="wecreatethis.com">
  <meta name="twitter:description" content="Blog.">
  <meta name="twitter:image" content="https://wecreatethis.com/og-image.png">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.json">
  <link rel="preload" href="/fonts/roboto-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/style.css">
  <script src="/icons.js" defer></script>
  <script src="/sw-toast.js" defer></script>
</head>
<body>
  <header>
    <nav id="crumbs" aria-label="Navigation"></nav>
  </header>

  <main>
    <div class="section-head">
      <h1 id="section-title"></h1>
    </div>

    <ul id="subsections"></ul>

    <div id="loading">Loading...</div>
    <div id="post-stack" style="display:none"></div>
  </main>

  <nav id="bottom-nav" class="bottom-nav" hidden></nav>

  <script src="/app.js" defer></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js', { scope: '/' });
    }
  </script>
</body>
</html>
