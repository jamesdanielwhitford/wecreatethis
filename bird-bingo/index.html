<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bird Bingo</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="styles.css">
<script src="/sw-toast.js" defer></script>
</head>
<body>

<div class="app-header" id="app-header-slot"></div>
<p class="status">Bingo cards built from real, recent bird sightings near you.</p>

<div class="home-actions">
  <a href="daily">
    <div class="action-title" id="daily-action-title"></div>
    <div class="action-desc">One 3x3 card per day, based on your saved location.</div>
  </a>
  <a href="practice">
    <div class="action-title" id="practice-action-title"></div>
    <div class="action-desc">Choose a size, regenerate as many cards as you like.</div>
  </a>
  <a href="life">
    <div class="action-title" id="life-action-title"></div>
    <div class="action-desc">Every bird you've logged in Bird Bingo.</div>
  </a>
</div>

<div class="location-footer">
  <div id="no-location" style="display:none;">
    <span class="status">No location set yet.</span>
    <button class="secondary" id="set-location-btn">Use My Location</button>
  </div>
  <div id="has-location" style="display:none;">
    <span class="status" id="location-summary"></span>
    <button class="secondary" id="change-location-btn">Update</button>
  </div>
  <div class="status" id="location-status"></div>
</div>

<div id="app-menu-slot"></div>

<script src="icons.js"></script>
<script src="menu.js"></script>
<script src="ebird.js"></script>
<script src="location.js"></script>
<script src="app.js"></script>
<script>
AppMenu.applyStoredTheme();
AppMenu.mount('Bird Bingo', 'https://wecreatethis.com');
document.getElementById('app-menu-body').innerHTML = `
  <p class="status" style="margin-top:0;">Location and card settings live on the Daily Game and Practice Mode pages.</p>
`;

document.getElementById('daily-action-title').innerHTML = Icons.svg('calendar') + 'Daily Game';
document.getElementById('practice-action-title').innerHTML = Icons.svg('target') + 'Practice Mode';
document.getElementById('life-action-title').innerHTML = Icons.svg('bookOpen') + 'Life List';

function renderLocationPanel() {
  const location = Shared.getSavedLocation();
  const noLocEl = document.getElementById('no-location');
  const hasLocEl = document.getElementById('has-location');

  if (location) {
    noLocEl.style.display = 'none';
    hasLocEl.style.display = 'block';
    document.getElementById('location-summary').textContent =
      `${location.regionName || 'Unknown region'} (${location.lat.toFixed(4)}, ${location.lng.toFixed(4)})`;
  } else {
    noLocEl.style.display = 'block';
    hasLocEl.style.display = 'none';
  }
}

async function handleSetLocation() {
  const statusEl = document.getElementById('location-status');
  statusEl.textContent = 'Getting your location...';
  try {
    await Shared.captureLocation();
    statusEl.textContent = '';
    renderLocationPanel();
  } catch (err) {
    statusEl.textContent = err.message;
  }
}

document.getElementById('set-location-btn').addEventListener('click', handleSetLocation);
document.getElementById('change-location-btn').addEventListener('click', handleSetLocation);

renderLocationPanel();

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(err => console.error('SW registration failed', err));
}
</script>

</body>
</html>
