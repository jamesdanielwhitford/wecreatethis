<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#333">
  <title>Contact - wecreatethis.com</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: system-ui, sans-serif;
      padding: 20px;
      max-width: 400px;
      margin: 0 auto;
      color: #333;
    }
    .game-navbar {
      position: sticky;
      top: 0;
      background: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 48px;
      margin: -20px -20px 16px -20px;
      padding: 0 20px;
      z-index: 100;
      border-bottom: 1px solid #eee;
    }
    .contact-content {
      margin-top: 48px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .contact-name {
      font-size: 1.4rem;
      font-weight: 600;
      color: #333;
    }
    .contact-email {
      font-size: 1rem;
      color: #555;
      text-decoration: none;
    }
    .contact-email:hover {
      text-decoration: underline;
    }
  </style>
  <script src="/sw-toast.js" defer></script>
</head>
<body>
  <nav class="game-navbar">
    <a href="/" style="position: absolute; left: 20px; font-size: 20px; color: #333; text-decoration: none; line-height: 1;">&#8592;</a>
    <span style="font-weight: bold; font-size: 18px;">Contact</span>
  </nav>

  <div class="contact-content">
    <span class="contact-name">James Daniel Whitford</span>
    <a href="mailto:james@wecreatethis.com" class="contact-email">james@wecreatethis.com</a>
  </div>
</body>
</html>
